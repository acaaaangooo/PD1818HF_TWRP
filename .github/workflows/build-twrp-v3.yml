name: Build TWRP 8.1 Legacy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: Build in Ubuntu 18.04
        run: |
          mkdir -p $HOME/twrp
          cat > $HOME/build.sh <<'EOF'
          set -ex
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git-core gnupg flex bison build-essential zip curl ca-certificates \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip python python3 rsync \
            bc cpio openjdk-8-jdk gcc-multilib g++-multilib lib32ncurses5-dev \
            lib32readline-dev libncurses5-dev liblz4-tool libxml2 lzop \
            squashfs-tools ccache
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          cd /root/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j4
          mkdir -p device/vivo
          cp -r /device_tree device/vivo/PD1818HF_EX
          rm -rf device/vivo/PD1818HF_EX/.git
          find device/vivo/PD1818HF_EX -name Android.bp -delete
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_PD1818HF_EX-eng
          mka recoveryimage -j$(nproc)
          EOF
          docker run --rm \
            -v $HOME/twrp:/root/twrp \
            -v $GITHUB_WORKSPACE/device_tree:/device_tree \
            -v $HOME/build.sh:/build.sh \
            ubuntu:18.04 bash /build.sh

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-8.1
          path: /home/runner/twrp/out/target/product/PD1818HF_EX/recovery.img
          if-no-files-found: error
